<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 740" width="1010" height="740">
  <style>

  text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
  .tb { font-size: 17px; font-weight: bold; }
  .s  { font-size: 15px; fill: #4a4a4a; }
  .xs { font-size: 13px; fill: #4a4a4a; }
  .m  { font-family: "Courier New", Courier, monospace; font-size: 15px; }
  .mb { font-family: "Courier New", Courier, monospace; font-size: 17px; font-weight: bold; }
  .ms { font-family: "Courier New", Courier, monospace; font-size: 14px; }
  .ac { fill: #1f4e79; }
  .num { font-size: 26px; font-weight: bold; fill: #1f4e79; }
  .box  { fill: #ffffff; stroke: #333333; stroke-width: 1.4; }
  .boxa { fill: #eaf0f6; stroke: #1f4e79; stroke-width: 1.4; }
  .boxg { fill: #f4f4f4; stroke: #333333; stroke-width: 1.4; }
  .reg  { fill: none; stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 6 5; }
  .ln   { stroke: #333333; stroke-width: 1.4; fill: none; }
  .lna  { stroke: #1f4e79; stroke-width: 2.2; fill: none; }
  .lnd  { stroke: #9aa5b1; stroke-width: 1.1; fill: none; stroke-dasharray: 5 5; }
  .thin { stroke: #666666; stroke-width: 1; fill: none; }
  </style>
  <rect x="0" y="0" width="1010" height="740" fill="#ffffff"></rect>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"></path>
    </marker>
    <marker id="arwa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
